version: '3.8'

services:
  vayudrishti:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vayudrishti-weather-platform
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
    volumes:
      - weather_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/analytics/summary"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  weather_data:
